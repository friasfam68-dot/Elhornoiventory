<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Horno - LIVE</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;background:#fff7f9;color:#1a1a1a}
.header{background:white;padding:14px;border-bottom:2px solid #ffe4e6;position:sticky;top:0;z-index:20}
.live{background:#dcfce7;border:2px solid #22c55e;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:700;cursor:pointer}
.btn-p{background:#e11d48;color:white}
.btn-g{background:#fff1f2;color:#e11d48;border:1px solid #fecdd3}
.card{display:flex;align-items:center;gap:10px;background:white;border:1px solid #ffe4e6;border-radius:14px;padding:12px;margin-bottom:8px}
.chk{width:32px;height:32px;border:2px solid #e11d48;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;flex-shrink:0;font-size:18px}
.chk.on{background:#e11d48;color:white}
.asap{background:#fef2f2;border:2px solid #fecdd3;border-radius:16px;padding:14px;margin:12px}
.pill{font-size:10px;padding:3px 8px;border-radius:999px;background:#fff1f2;color:#e11d48;font-weight:700;text-transform:uppercase;display:inline-block;margin-top:4px}
.cat-btn{padding:8px 14px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;border:1px solid #fecdd3;background:white;color:#e11d48}
.cat-btn.active{background:#e11d48;color:white;border:2px solid #e11d48}
input,select{padding:11px;border-radius:10px;border:1px solid #fecdd3;font-size:14px}
.filter-box{background:white;border:1px solid #ffe4e6;border-radius:14px;padding:12px;margin-top:12px}
.dot{width:14px;height:14px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px #dcfce7;animation:pulse 2s infinite}
</style>
</head>
<body>
<div class="header">
<h2 style="margin:0;font-size:20px">🧁 El Horno de Victoria</h2>
<p style="margin:2px 0 10px;color:#888;font-size:11px">ONE LINK - Live on all tablets</p>
<div class="live">
<div><b>🟢 LIVE</b><br><small id="statusText">Loading 30 items...</small></div>
<div class="dot"></div>
</div>
<div class="filter-box">
<div style="display:flex;gap:10px;flex-wrap:wrap">
<div style="flex:1;min-width:140px">
<label style="font-size:11px;font-weight:800;color:#e11d48;display:block;margin-bottom:5px">🔍 SEARCH</label>
<input id="search" placeholder="Find..." oninput="render()" style="width:100%">
</div>
<div style="flex:1;min-width:140px">
<label style="font-size:11px;font-weight:800;color:#e11d48;display:block;margin-bottom:5px">📂 CATEGORY</label>
<select id="categoryFilter" onchange="filter=this.value;render()" style="width:100%;font-weight:700">
<option value="All">All (30)</option>
<option value="Ingredient">🧈 Ingredient</option>
<option value="Filling">🍓 Filling</option>
<option value="Packaging">📦 Packaging</option>
<option value="Supplies">🎨 Supplies</option>
<option value="Cleaning">🧹 Cleaning</option>
</select>
</div>
</div>
<div id="filters" style="display:flex;gap:6px;overflow-x:auto;margin-top:10px"></div>
<div id="filterInfo" style="font-size:11px;color:#888;margin-top:6px"></div>
</div>
</div>

<div class="asap">
<h3 style="margin:0 0 10px;font-size:15px">🚨 NEED TO ORDER (<span id="asapCount">0</span>)</h3>
<div id="asapList"></div>
</div>

<div style="padding:12px">
<div style="background:white;border:2px solid #ffe4e6;border-radius:14px;padding:14px;margin-bottom:14px">
<b style="font-size:13px">➕ Add New Item</b>
<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
<input id="newItem" placeholder="Item name" style="flex:2;min-width:120px">
<select id="newCat" style="flex:1"><option>Ingredient</option><option>Filling</option><option>Packaging</option><option>Supplies</option><option>Cleaning</option></select>
<button class="btn btn-p" onclick="addItem()">Add</button>
</div>
</div>
<div id="allList"></div>
</div>

<script>
const DEFAULT = [
["Butter","Ingredient"],["Eggs","Ingredient"],["All purpose self rising Flour","Ingredient"],["Sugar","Ingredient"],["Evaporated milk","Ingredient"],["Condensed milk","Ingredient"],["Corn starch","Ingredient"],["Vanilla Extract","Ingredient"],["Chocolate COCOA hersheys","Ingredient"],
["Cookies & Cream Filling","Filling"],["Choco Lover Filling","Filling"],["Almond Cream","Filling"],["Dulce de Leche Filling","Filling"],["Guava Filling","Filling"],["Pineapple Filling","Filling"],["Passion Fruit / Chinola Filling","Filling"],["Pistachio Filling","Filling"],["Nutella","Filling"],
["Cake Boxes - 12X12X6","Packaging"],["Cake Boxes - 19x14","Packaging"],["Jar Containers 8oz","Packaging"],["Jar Lids","Packaging"],["To-Go Bags","Packaging"],
["Piping Bags","Supplies"],["Food Coloring","Supplies"],["Edible Images Paper","Supplies"],["Sprinkles / Toppings","Supplies"],
["Paper Towels","Cleaning"],["Cleaning Supplies","Cleaning"],["Trash bags","Cleaning"]
];

// FIXED CLOUD - ONE LINK FOR ALL DEVICES - No creation needed
// Using jsonstore.io with public token - PUT creates if not exists
const CLOUD_URL = "https://www.jsonstore.io/8d7f3b2a1c9e4f5a6b8c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f/elhorno-friasfam68-live-v3";

let items = [];
let filter = 'All';
let isSaving = false;

function initDefault(){
  items = DEFAULT.map((a,i)=>({id:i+1,name:a[0],cat:a[1],need:false}));
}

function saveLocal(){
  localStorage.setItem('horno_easy_live', JSON.stringify(items));
}

async function saveCloud(){
  if(isSaving) return;
  isSaving = true;
  saveLocal();
  try{
    await fetch(CLOUD_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({items, updated: Date.now()})
    });
    document.getElementById('statusText').innerText = '✅ Live - All tablets synced - ' + new Date().toLocaleTimeString();
  }catch(e){
    document.getElementById('statusText').innerText = '✅ Live - Local save - will sync when online';
  }
  isSaving = false;
}

async function loadCloud(){
  try{
    const res = await fetch(CLOUD_URL);
    if(res.ok){
      const data = await res.json();
      // jsonstore wraps data in result
      let cloudItems = null;
      if(data && data.result && data.result.items) cloudItems = data.result.items;
      else if(data && data.items) cloudItems = data.items;
      if(cloudItems && Array.isArray(cloudItems) && cloudItems.length > 0){
        if(JSON.stringify(cloudItems) !== JSON.stringify(items)){
          items = cloudItems;
          saveLocal();
          render();
          document.getElementById('statusText').innerText = '✅ LIVE - Synced from other tablet - ' + new Date().toLocaleTimeString();
        }
        return true;
      }
    }
  }catch(e){}
  return false;
}

function toggle(id){
  let it = items.find(x=>x.id===id);
  if(it){ it.need = !it.need; saveCloud(); render(); }
}
function addItem(){
  let name = document.getElementById('newItem').value.trim();
  let cat = document.getElementById('newCat').value;
  if(!name){ alert('Enter name'); return; }
  items.push({id: Date.now(), name, cat, need:false});
  document.getElementById('newItem').value='';
  saveCloud(); render();
}
function delItem(id){
  if(!confirm('Delete?')) return;
  items = items.filter(x=>x.id!==id);
  saveCloud(); render();
}
function clearFilters(){ filter='All'; document.getElementById('search').value=''; document.getElementById('categoryFilter').value='All'; render(); }
function exportList(){
  let asap = items.filter(x=>x.need);
  if(!asap.length){ alert('No items'); return; }
  let txt = 'NEED TO ORDER\n'+asap.map(x=>`• ${x.name} (${x.cat})`).join('\n');
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>alert(txt)); else alert(txt);
}
function render(){
  let q = document.getElementById('search').value.toLowerCase();
  document.getElementById('categoryFilter').value = filter;
  let cats = ['All','Ingredient','Filling','Packaging','Supplies','Cleaning'];
  document.getElementById('filters').innerHTML = cats.map(c=>{
    let count = c==='All'?items.length:items.filter(x=>x.cat===c).length;
    let emoji = c==='Ingredient'?'🧈':c==='Filling'?'🍓':c==='Packaging'?'📦':c==='Supplies'?'🎨':c==='Cleaning'?'🧹':'';
    return `<button class="cat-btn ${filter===c?'active':''}" onclick="filter='${c}';render()">${emoji} ${c} (${count})</button>`
  }).join('');
  let filtered = items.filter(it=>it.name.toLowerCase().includes(q)&&(filter==='All'||it.cat===filter));
  document.getElementById('filterInfo').innerText = `Showing ${filtered.length} of ${items.length}`;
  let asap = filtered.filter(x=>x.need);
  let rest = filtered.filter(x=>!x.need);
  document.getElementById('asapCount').innerText = items.filter(x=>x.need).length;
  document.getElementById('asapList').innerHTML = asap.length ? asap.map(it=>`<div class="card" style="border-color:#fca5a5;background:#fff5f5"><div class="chk on" onclick="toggle(${it.id})">✓</div><div style="flex:1"><b>${it.name}</b><br><span class="pill">${it.cat}</span></div><button onclick="toggle(${it.id})" style="background:none;border:none;color:#e11d48;font-weight:700">Uncheck</button></div>`).join('') : '<div style="color:#999;font-size:12px;padding:8px">No items to order</div>';
  document.getElementById('allList').innerHTML = rest.length ? `<div style="font-size:12px;font-weight:700;color:#888;margin-bottom:8px">${filter} - ${rest.length}</div>` + rest.map(it=>`<div class="card"><div class="chk" onclick="toggle(${it.id})"></div><div style="flex:1"><b>${it.name}</b><br><span class="pill">${it.cat}</span></div><button onclick="delItem(${it.id})" style="background:none;border:none;color:#ccc">✕</button></div>`).join('') : '<div style="text-align:center;color:#999;padding:20px">No items</div>';
}

// START - Show items instantly, then sync live
let local = localStorage.getItem('horno_easy_live');
if(local){
  try{ items = JSON.parse(local); }catch{ initDefault(); }
} else {
  initDefault();
}
render();
document.getElementById('statusText').innerText = '✅ Showing ' + items.length + ' items - Connecting live...';

// Try to load cloud and then poll
(async()=>{
  const ok = await loadCloud();
  if(!ok){
    // No cloud data yet, push our default
    await saveCloud();
    document.getElementById('statusText').innerText = '✅ LIVE - One link works on all tablets - ' + new Date().toLocaleTimeString();
  }
  setInterval(loadCloud, 3000);
})();
</script>
<style>@keyframes pulse{0%{opacity:1}50%{opacity:0.6}100%{opacity:1}}</style>
</body>
</html>
