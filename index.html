<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Horno de Victoria - Inventory</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;background:#fff7f9;color:#1a1a1a}
.header{background:white;padding:14px;border-bottom:2px solid #ffe4e6;position:sticky;top:0;z-index:10}
.sync{background:#dcfce7;border:2px solid #22c55e;border-radius:12px;padding:12px}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:700;cursor:pointer}
.btn-p{background:#e11d48;color:white}
.btn-g{background:#fff1f2;color:#e11d48;border:1px solid #fecdd3}
.card{display:flex;align-items:center;gap:10px;background:white;border:1px solid #ffe4e6;border-radius:14px;padding:12px;margin-bottom:8px}
.chk{width:32px;height:32px;border:2px solid #e11d48;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;flex-shrink:0}
.chk.on{background:#e11d48;color:white}
.asap{background:#fef2f2;border:2px solid #fecdd3;border-radius:16px;padding:14px;margin:12px}
.pill{font-size:10px;padding:3px 8px;border-radius:999px;background:#fff1f2;color:#e11d48;font-weight:700;text-transform:uppercase}
.cat-btn{padding:6px 12px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;border:1px solid #fecdd3;background:white;color:#e11d48}
.cat-btn.active{background:#e11d48;color:white;border:2px solid #e11d48}
input,select{padding:10px;border-radius:10px;border:1px solid #fecdd3;font-size:14px}
</style>
</head>
<body>
<div class="header">
<h2 style="margin:0;font-size:18px">🧁 El Horno de Victoria</h2>
<p style="margin:2px 0 10px;color:#888;font-size:11px">Live inventory - same on all tablets & phones</p>

<div class="sync">
<div style="display:flex;justify-content:space-between;align-items:center">
<div><b>🟢 LIVE SYNC ON</b><br><small id="status">Share link to sync with team</small></div>
<div id="dot" style="width:12px;height:12px;background:#22c55e;border-radius:50%"></div>
</div>
<div style="margin-top:8px;display:flex;gap:6px;align-items:center">
<small>Team:</small><input id="team" value="HORNOVICTORIA" style="flex:1;max-width:150px">
<button class="btn btn-p" onclick="copyLink()">Copy Share Link</button>
</div>
<div id="shareLink" style="display:none"></div>
</div>

<div style="margin-top:12px;background:white;border:1px solid #ffe4e6;border-radius:12px;padding:10px">
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<div style="flex:1;min-width:140px">
<label style="font-size:11px;font-weight:700;color:#e11d48;display:block;margin-bottom:4px">🔍 SEARCH</label>
<input id="search" placeholder="Type to find..." oninput="render()" style="width:100%">
</div>
<div style="min-width:140px">
<label style="font-size:11px;font-weight:700;color:#e11d48;display:block;margin-bottom:4px">📂 CATEGORY FILTER</label>
<select id="categoryFilter" onchange="filter=this.value;render()" style="width:100%;font-weight:700">
<option value="All">All Categories (30)</option>
<option value="Ingredient">🧈 Ingredient</option>
<option value="Filling">🍓 Filling</option>
<option value="Packaging">📦 Packaging</option>
<option value="Supplies">🎨 Supplies</option>
<option value="Cleaning">🧹 Cleaning</option>
</select>
</div>
<button class="btn btn-g" onclick="exportList()" style="height:40px;margin-top:16px">Export List</button>
</div>
<div id="filters" style="display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:4px"></div>
<div id="filterInfo" style="font-size:11px;color:#888;margin-top:6px"></div>
</div>
</div>

<div class="asap">
<h3 style="margin:0 0 10px;font-size:15px">🚨 NEED TO ORDER ASAP (<span id="asapCount">0</span>)</h3>
<div id="asapList"></div>
</div>

<div style="padding:12px">
<div style="background:white;border:1px solid #ffe4e6;border-radius:14px;padding:12px;margin-bottom:14px">
<b style="font-size:13px">➕ Add New Item</b>
<div style="display:flex;gap:6px;margin-top:8px">
<input id="newItem" placeholder="Item name (e.g. Strawberries)" style="flex:1">
<select id="newCat"><option>Ingredient</option><option>Filling</option><option>Packaging</option><option>Supplies</option><option>Cleaning</option></select>
<button class="btn btn-p" onclick="addItem()">Add</button>
</div>
</div>

<div id="allList"></div>
</div>

<script>
const DEFAULT=[["Butter","Ingredient"],["Eggs","Ingredient"],["All purpose self rising Flour","Ingredient"],["Sugar","Ingredient"],["Evaporated milk","Ingredient"],["Condensed milk","Ingredient"],["Corn starch","Ingredient"],["Vanilla Extract","Ingredient"],["Chocolate COCOA hersheys","Ingredient"],["Cookies & Cream Filling","Filling"],["Choco Lover Filling","Filling"],["Almond Cream","Filling"],["Dulce de Leche Filling","Filling"],["Guava Filling","Filling"],["Pineapple Filling","Filling"],["Passion Fruit / Chinola Filling","Filling"],["Pistachio Filling","Filling"],["Nutella","Filling"],["Cake Boxes - 12X12X6","Packaging"],["Cake Boxes - 19x14","Packaging"],["Jar Containers 8oz","Packaging"],["Jar Lids","Packaging"],["To-Go Bags","Packaging"],["Piping Bags","Supplies"],["Food Coloring","Supplies"],["Edible Images Paper","Supplies"],["Sprinkles / Toppings","Supplies"],["Paper Towels","Cleaning"],["Cleaning Supplies","Cleaning"],["Trash bags","Cleaning"]];
let items=JSON.parse(localStorage.getItem('horno_v6')||'null');
if(!items||!items.length){items=DEFAULT.map((a,i)=>({id:i,name:a[0],cat:a[1],need:false}));localStorage.setItem('horno_v6',JSON.stringify(items));}
let filter='All';
function save(){localStorage.setItem('horno_v6',JSON.stringify(items));updateLink();}
function toggle(id){let it=items.find(x=>x.id===id);it.need=!it.need;save();render();}
function addItem(){let name=document.getElementById('newItem').value.trim();let cat=document.getElementById('newCat').value;if(!name){alert('Enter item name');return;}items.push({id:Date.now(),name,cat,need:false});document.getElementById('newItem').value='';save();render();}
function delItem(id){if(!confirm('Delete this item?'))return;items=items.filter(x=>x.id!==id);save();render();}
function exportList(){let asap=items.filter(x=>x.need);if(!asap.length){alert('No items need ordering');return;}let txt='NEED TO ORDER - El Horno\n\n'+asap.map(x=>`• ${x.name} (${x.cat})`).join('\n');if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>alert('Copied!\n\n'+txt));else alert(txt);}
function copyLink(){let link=document.getElementById('shareLink').innerText;if(navigator.clipboard){navigator.clipboard.writeText(link).then(()=>alert('✅ Share link copied!\n\nPaste it in WhatsApp to your team. When they open it, they will see your exact list and any checks you make will sync.'));}else{prompt('Copy this link and send to team:',link);}}
function updateLink(){try{let t=document.getElementById('team').value||'HORNOVICTORIA';let d=btoa(JSON.stringify(items));let base=location.href.split('?')[0].split('#')[0];document.getElementById('shareLink').innerText=base+'#'+d.slice(0,1800);}catch(e){}}
function render(){
  let q=document.getElementById('search').value.toLowerCase();
  // sync dropdown
  let sel=document.getElementById('categoryFilter');
  if(sel && sel.value!==filter) sel.value=filter;
  let cats=['All','Ingredient','Filling','Packaging','Supplies','Cleaning'];
  document.getElementById('filters').innerHTML=cats.map(c=>{
    let count=c==='All'?items.length:items.filter(x=>x.cat===c).length;
    return `<button class="cat-btn ${filter===c?'active':''}" onclick="filter='${c}';document.getElementById('categoryFilter').value='${c}';render()">${c} (${count})</button>`
  }).join('');
  let filtered=items.filter(it=>it.name.toLowerCase().includes(q)&&(filter==='All'||it.cat===filter));
  let info=document.getElementById('filterInfo');
  if(info){ if(filter!=='All' || q){ info.innerText=`Showing ${filtered.length} of ${items.length} items` + (filter!=='All'?` in ${filter}`:'') + (q?` matching "${q}"`:``); } else { info.innerText=`Showing all ${items.length} items`; } }
  let asap=filtered.filter(x=>x.need);
  let rest=filtered.filter(x=>!x.need);
  document.getElementById('asapCount').innerText=items.filter(x=>x.need).length;
  document.getElementById('asapList').innerHTML=asap.length?asap.map(it=>`<div class="card" style="border-color:#fca5a5;background:#fff5f5"><div class="chk on" onclick="toggle(${it.id})">✓</div><div style="flex:1"><b>${it.name}</b><br><span class="pill">${it.cat}</span></div><button onclick="toggle(${it.id})" style="background:none;border:none;color:#e11d48;font-weight:700;font-size:12px">Uncheck</button></div>`).join(''):'<div style="color:#999;font-size:12px">No items need ordering - check items below</div>';
  document.getElementById('allList').innerHTML=rest.length?rest.map(it=>`<div class="card"><div class="chk" onclick="toggle(${it.id})"></div><div style="flex:1"><b>${it.name}</b><br><span class="pill">${it.cat}</span></div><button onclick="delItem(${it.id})" style="background:none;border:none;color:#ccc;font-size:18px">✕</button></div>`).join(''):'<div style="text-align:center;color:#999;padding:20px">No items in this category</div>';
}
try{if(location.hash.length>20){let d=JSON.parse(atob(location.hash.slice(1)));if(Array.isArray(d)&&d.length>0){items=d;localStorage.setItem('horno_v6',JSON.stringify(items));}}}catch(e){}
render();updateLink();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
